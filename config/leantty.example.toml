# leantty-zig 配置示例（与 Rust 版 leantty 的配置格式兼容，但只实现其中一部分键；
# 未实现的键会在启动时打印 "未实现，已忽略: <键名>"，不会静默忽略）。

[window]
dimensions = { columns = 120, lines = 30 }
dynamic_title = true          # 标题跟随 OSC 0/2
# padding / opacity 暂未实现（启动会提示）

[font]
size = 13.0                   # 单位是"点"：像素 = 点 × Xft.dpi / 72（与 alacritty 一致）
fallback = ["HYQiHei", "Symbola"]   # 回退链；内置还会兜底 Noto Color Emoji / Symbola

[font.normal]
family = "Consolas"
style = "Regular"
# [font.bold] / [font.italic] / [font.bold_italic] 同理；家族没有对应字重时不做合成

[scrolling]
history = 10000
multiplier = 3

[renderer]
backend = "auto"              # auto | cpu | gpu（gpu = 字形进图集直画，不上传整帧）

[cursor]
blink = false                 # 光标闪烁（默认关）

[selection]
save_to_clipboard = true

[colors]
draw_bold_text_with_bright_colors = true

# SGR 2（faint / dim）的压暗行为：
#   faint = false  → 按原色绘制（与 Rust 版 Windows 行为一致）
#   faint_opacity  → 压暗强度 0..1，默认 0.5（等价 ghostty 的 faint-opacity）
#                    显示色 = 背景 ×(1-p) + 前景 ×p
faint = true
faint_opacity = 0.5

[colors.primary]
background = "#F3F1E9"
foreground = "#303238"

[colors.cursor]
cursor = "#5579A8"
text = "#F3F1E9"

[colors.normal]
# 浅色背景（#F3F1E9）下的对比度全部 ≥4.6:1（WCAG AA 正文标准）。
black = "#303238"
red = "#B84747"
green = "#367A49"
yellow = "#8D651F"
blue = "#3568A8"
magenta = "#8F5C84"
cyan = "#30767A"
white = "#6D6D67"

# bright 组同样按 ≥4.6:1 重算（保色相、只压亮度）。
# white 例外：它是"接近背景"的浅色，常被 TUI 当**底色**用，保持浅；
# 它作为**前景**时改走 white_fg —— inbox conhost 会把"SGR 1 无颜色"归一化成
# bright white，浅色主题下就是白字白底（实地取证见 REPORT 6.64）。
[colors.bright]
black = "#6D6C66"
red = "#C63932"
green = "#3D784D"
yellow = "#87672B"
blue = "#416DAA"
magenta = "#945986"
cyan = "#3C7575"
white = "#DCD8CB"
white_fg = "#303238"

# 鼠标绑定：Middle=Copy / Right=Paste
[[mouse.bindings]]
mouse = "Middle"
action = "Copy"

[[mouse.bindings]]
mouse = "Right"
action = "Paste"

# 键盘绑定：Insert 家族（未配置时也有默认语义）
[[keyboard.bindings]]
key = "Insert"
mods = "Control"
action = "Copy"

[[keyboard.bindings]]
key = "Insert"
mods = "Shift"
action = "Paste"
